<div class="container">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Lista de Productos</h4>
          <div>
            <button class="btn btn-light">
              <i class="bi bi-plus-lg"></i> Nuevo Producto
            </button>
          </div>
        </div>
        <div class="card-body">
          <form class="mb-4">
            <div class="row g-3">
              <div class="col-md-4">
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="Buscar por nombre o código...">
                  <button class="btn btn-primary" type="button">
                    <i class="bi bi-search"></i> Buscar
                  </button>
                </div>
              </div>
              <div class="col-md-3">
                <select class="form-select">
                  <option value="">Todas las categorías</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select">
                  <option value="">Todos los proveedores</option>
                </select>
              </div>
              <div class="col-md-2">
                <div class="form-check mt-2">
                  <input type="checkbox" class="form-check-input" id="stock_bajo">
                  <label class="form-check-label" for="stock_bajo">Stock bajo</label>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
